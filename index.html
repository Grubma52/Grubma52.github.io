<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body>
    <p>Loading content...</p>

    <script>
        (async () => {
            const url = "https://19ca4ff0-frame.matthias-gruber.workers.dev/";

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const html = await response.text();

                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                document.body.textContent =
                    "Failed to load content: " + error.message;
                console.error(error);
            }
        })();
    </script>
</body>
</html>
